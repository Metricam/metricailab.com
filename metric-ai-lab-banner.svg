<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metric AI Lab — Frontier AI research lab, Yerevan, Armenia">
  <title>Metric AI Lab — Frontier AI research lab, Yerevan, Armenia</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap');

      /* same palette as the OhanASR / OhanTTS / Ayb release banners:
         blush bg #fdeff1 · navy ink #0f1b2d · slate #4b5563 · red #e5231c · soft red #f47c82 · pill #fbd9dd */
      .display{ font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif; }

      .rise{ opacity:1; animation:riseFadeLoop 6s ease-in-out infinite; }
      @keyframes riseFadeLoop{ 0%{opacity:0;} 8%{opacity:1;} 92%{opacity:1;} 100%{opacity:0;} }

      .rise-y{ opacity:1; animation:riseYLoop 6s ease-in-out infinite; }
      @keyframes riseYLoop{ 0%{opacity:0; transform:translateY(10px);} 8%{opacity:1; transform:translateY(0);} 92%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(10px);} }

      .d1{ animation-delay:0s; } .d2{ animation-delay:.25s; } .d3{ animation-delay:.4s; } .d4{ animation-delay:.55s; }

      .bar{ transform-box:fill-box; transform-origin:left center; animation:growLoop 6s ease-in-out infinite; }
      @keyframes growLoop{ 0%{ transform:scaleX(0); } 7%{ transform:scaleX(1); } 92%{ transform:scaleX(1); } 100%{ transform:scaleX(0); } }
      .b1{ animation-delay:0s; } .b2{ animation-delay:.12s; } .b3{ animation-delay:.24s; }

      .drift{ animation:drift 12s ease-in-out infinite alternate; }
      @keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(-18px); } }

      @media (prefers-reduced-motion: reduce){
        .rise,.rise-y,.bar,.drift{ animation:none; opacity:1; transform:none; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf1f2"/>
      <stop offset="1" stop-color="#fae4e7"/>
    </linearGradient>

    <linearGradient id="peak" x1="0" y1="60" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2b6c1"/>
      <stop offset="1" stop-color="#f6dde1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="130" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ebc8d0"/>
      <stop offset="1" stop-color="#f8e3e6" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- ============ Ararat: Sis (small) + Masis (large), as on the model banners ============ -->
    <path d="M640 300 L800 168 Q826 146 852 166 L960 250 L1000 300 Z" fill="url(#peakBack)"/>
    <path d="M800 168 Q826 146 852 166 L836 172 L826 164 L814 176 Z" fill="#ffffff" opacity=".85"/>

    <path d="M760 300 L962 96 Q1000 62 1040 94 L1200 214 L1200 300 Z" fill="url(#peak)"/>
    <path d="M962 96 Q1000 62 1040 94 L1022 104 L1008 92 L994 108 L978 98 Z" fill="#ffffff" opacity=".9"/>
    <path d="M962 96 Q1000 62 1040 94" stroke="#dcb2bc" stroke-width="2" fill="none" opacity=".7"/>

    <!-- ============ clouds ============ -->
    <g class="drift" fill="#f6cfd5">
      <path d="M1048 70 a22 22 0 0 1 40 -8 a28 28 0 0 1 52 8 a16 16 0 0 1 14 16 h-122 a14 14 0 0 1 16 -16 Z"/>
      <path d="M712 214 a18 18 0 0 1 32 -6 a24 24 0 0 1 44 6 a13 13 0 0 1 12 13 h-100 a12 12 0 0 1 12 -13 Z" opacity=".8"/>
    </g>

    <!-- soft ground wave -->
    <path d="M0 268 Q300 236 620 262 T1200 256 V300 H0 Z" fill="#f8dde1" opacity=".7"/>

    <!-- ============ logomark: the Metric mark — three bars forming an E ============ -->
    <g class="rise d1" transform="translate(76,88)">
      <rect class="bar b1" x="0" y="0"  width="92" height="26" rx="6" fill="#e5231c"/>
      <rect class="bar b2" x="0" y="47" width="58" height="26" rx="6" fill="#f47c82"/>
      <rect class="bar b3" x="0" y="94" width="92" height="26" rx="6" fill="#e5231c"/>
    </g>

    <!-- ============ wordmark ============ -->
    <g class="rise-y d2">
      <text x="198" y="150" class="display" font-size="72" font-weight="700" fill="#0f1b2d" letter-spacing="-2">Metric</text>
    </g>
    <g class="rise-y d3">
      <rect x="200" y="160" width="112" height="40" rx="14" fill="#fbd9dd"/>
      <text x="256" y="189" class="display" font-size="26" font-weight="700" fill="#e5231c" text-anchor="middle">AI Lab</text>
    </g>
    <g class="rise-y d4">
      <text x="201" y="232" class="display" font-size="17" font-weight="500" fill="#4b5563">Frontier AI research lab · Yerevan, Armenia</text>
    </g>
  </g>
</svg>
