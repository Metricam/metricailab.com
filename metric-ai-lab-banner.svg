<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metric AI Lab — Frontier AI research lab, Yerevan, Armenia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Metric AI Lab — Frontier AI research lab, Yerevan, Armenia</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&amp;display=swap');

      /* brand colors only — no invented accents:
         red #E5231C (logo) · ink #F5F3EE (text) · muted #868B94 (tagline) · bg #003049 */
      .display{ font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; fill:#f5f3ee; }
      .display-italic{ font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-style:italic; }
      .mono{ font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; }

      .rise{ opacity:1; animation-name:riseFadeLoop; animation-duration:6s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
      @keyframes riseFadeLoop{ 0%{opacity:0;} 8%{opacity:1;} 92%{opacity:1;} 100%{opacity:0;} }

      .rise-y{ opacity:1; animation-name:riseYLoop; animation-duration:6s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
      @keyframes riseYLoop{ 0%{opacity:0; transform:translateY(10px);} 8%{opacity:1; transform:translateY(0);} 92%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(10px);} }

      .d1{ animation-delay:0s; } .d2{ animation-delay:.25s; } .d3{ animation-delay:.4s; } .d4{ animation-delay:.55s; }

      .bar{ transform-box: fill-box; transform-origin: left center; animation-name:growLoop; animation-duration:6s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
      @keyframes growLoop{ 0%{ transform:scaleX(0); } 7%{ transform:scaleX(1); } 92%{ transform:scaleX(1); } 100%{ transform:scaleX(0); } }
      .b1{ animation-delay:0s; } .b2{ animation-delay:.12s; } .b3{ animation-delay:.24s; }

      @media (prefers-reduced-motion: reduce){
        .rise,.rise-y{ animation:none; opacity:1; }
        .rise-y{ transform:none; }
        .bar{ animation:none; transform:none; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#013a57"/>
      <stop offset=".55" stop-color="#003049"/>
      <stop offset="1" stop-color="#012338"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 150) rotate(90) scale(260 380)">
      <stop offset="0" stop-color="#e5231c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e5231c" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glowRed)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- ============ oversized echo of the brand's bar language, bleeding off the edges — atmosphere, not a second logo ============ -->
    <g filter="url(#soft)">
      <rect x="640" y="-30" width="760" height="150" fill="#e5231c" opacity=".14"/>
      <rect x="780" y="185" width="650" height="150" fill="#f5f3ee" opacity=".06"/>
    </g>

    <!-- ============ baseline ============ -->
    <line x1="0" y1="252" x2="1200" y2="252" stroke="#f5f3ee" stroke-opacity=".07"/>
    <g stroke="#f5f3ee" stroke-opacity=".16">
      <line x1="20" y1="248" x2="20" y2="252"/><line x1="60" y1="248" x2="60" y2="252"/><line x1="100" y1="244" x2="100" y2="252"/>
      <line x1="140" y1="248" x2="140" y2="252"/><line x1="180" y1="248" x2="180" y2="252"/><line x1="220" y1="244" x2="220" y2="252"/>
      <line x1="1000" y1="244" x2="1000" y2="252"/><line x1="1040" y1="248" x2="1040" y2="252"/><line x1="1080" y1="248" x2="1080" y2="252"/>
      <line x1="1120" y1="244" x2="1120" y2="252"/><line x1="1160" y1="248" x2="1160" y2="252"/>
    </g>

    <!-- ============ logomark: the real Metric mark — three red bars forming an E ============ -->
    <g class="rise d1" transform="translate(76,88)">
      <rect class="bar b1" x="0" y="0"  width="92" height="26" fill="#e5231c"/>
      <rect class="bar b2" x="0" y="47" width="58" height="26" fill="#e5231c"/>
      <rect class="bar b3" x="0" y="94" width="92" height="26" fill="#e5231c"/>
    </g>

    <!-- ============ wordmark ============ -->
    <g class="rise-y d2">
      <text x="200" y="150" class="display" font-size="72" font-weight="700">Metric</text>
    </g>
    <g class="rise-y d3">
      <text x="203" y="185" class="display-italic" font-size="32" fill="#e5231c">AI Lab</text>
    </g>
    <g class="rise-y d4">
      <text x="202" y="218" class="mono" font-size="13.5" fill="#868b94" letter-spacing=".2">Frontier AI research lab · Yerevan, Armenia</text>
    </g>
  </g>
</svg>
